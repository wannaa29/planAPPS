{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><link rel="manifest" href="{% static 'planner/manifest.json' %}"><link rel="stylesheet" href="{% static 'planner/app.css' %}"><link rel="stylesheet" href="{% static 'planner/apps.css' %}"><link rel="stylesheet" href="{% static 'planner/theme.css' %}"><title>WorkFlow Planner · Apps</title><script>document.documentElement.dataset.theme=localStorage.getItem('wf-theme')||'light';</script></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:28px"><div style="width:min(760px,100%)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:44px"><span class="brand-mark">W</span><strong style="font:800 17px Manrope">WorkFlow <span style="color:#8792a6;font-weight:600">Planner</span></strong><button id="theme-toggle" class="theme-toggle" style="margin-left:auto">◐</button></div><p class="eyebrow">Your workspace</p><h1 class="page-title">Choose an app</h1><p class="page-sub">Start with a note or move into your schedule.</p><section class="app-launcher" style="margin-top:28px"><a href="{% url 'notes' %}" class="app-tile notes-tile"><span class="app-tile-icon">✦</span><span><strong>Notes</strong><small>Capture ideas and references</small></span><b>→</b></a><a href="{% url 'schedule_dashboard' %}" class="app-tile flow-tile"><span class="app-tile-icon">◷</span><span><strong>Schedule Flow</strong><small>Shifts, tasks, and deadlines</small></span><b>→</b></a></section></div></main><script>document.getElementById('theme-toggle')?.addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';localStorage.setItem('wf-theme',dark?'dark':'light');});</script></body></html>
