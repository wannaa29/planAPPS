{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · WorkFlow Planner</title><link rel="stylesheet" href="{% static 'planner/app.css' %}"></head><body><div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7f8fc"><div class="card" style="width:min(420px,100%);padding:34px"><a class="brand" href="/" style="padding:0 0 28px"><span class="brand-mark">W</span><span>WorkFlow<span class="brand-light"> Planner</span></span></a><h1 class="page-title" style="font-size:24px">Create your workspace</h1><p class="page-sub" style="margin-bottom:25px">A calm command center for your work.</p><form method="post">{% csrf_token %}{% for field in form %}<p><label for="{{ field.id_for_label }}" style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">{{ field.label }}</label>{{ field }}{% if field.errors %}<small style="color:var(--red)">{{ field.errors|striptags }}</small>{% endif %}</p>{% endfor %}<button class="btn" style="width:100%;justify-content:center;margin-top:8px">Create account</button></form><p style="text-align:center;color:var(--muted);font-size:12px;margin-top:22px">Already have an account? <a href="{% url 'login' %}" style="color:var(--indigo);font-weight:700">Sign in</a></p></div></div></body></html>
