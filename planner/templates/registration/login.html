{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · WorkFlow Planner</title><link rel="stylesheet" href="{% static 'planner/app.css' %}"></head><body><div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7f8fc"><div class="card" style="width:min(420px,100%);padding:34px"><a class="brand" href="/" style="padding:0 0 28px"><span class="brand-mark">W</span><span>WorkFlow<span class="brand-light"> Planner</span></span></a><h1 class="page-title" style="font-size:24px">Welcome back</h1><p class="page-sub" style="margin-bottom:25px">Sign in to pick up where you left off.</p><form method="post">{% csrf_token %}{% for field in form %}<p><label for="{{ field.id_for_label }}" style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">{{ field.label }}</label><input class="input" type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required></p>{% endfor %}{% if form.errors %}<p style="color:var(--red);font-size:12px">Please check your username and password.</p>{% endif %}<button class="btn" style="width:100%;justify-content:center;margin-top:8px">Sign in</button></form><p style="text-align:center;color:var(--muted);font-size:12px;margin-top:22px">New here? <a href="{% url 'register' %}" style="color:var(--indigo);font-weight:700">Create an account</a></p></div></div></body></html>
